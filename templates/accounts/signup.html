{% extends 'base.html' %}

{% block title %}회원가입{% endblock %}

{% block content %}
<div class="card">
    <h1>회원가입</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <small style="color: #666;">{{ field.help_text }}</small>
                {% endif %}
                {% if field.errors %}
                    <div style="color: red;">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">회원가입</button>
        <a href="{% url 'pages:home' %}" class="btn">취소</a>
    </form>
</div>
{% endblock %}
