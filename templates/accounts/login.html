{% extends 'base.html' %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="card">
    <h1>로그인</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div style="color: red;">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn">로그인</button>
        <a href="{% url 'pages:home' %}" class="btn btn-danger">취소</a>
    </form>
    <p style="margin-top: 1rem;">
        계정이 없으신가요? <a href="{% url 'accounts:signup' %}">회원가입</a>
    </p>
</div>
{% endblock %}
