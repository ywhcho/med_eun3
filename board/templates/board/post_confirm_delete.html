{% extends 'base.html' %}

{% block title %}게시글 삭제{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h3>게시글 삭제</h3>
            </div>
            <div class="card-body">
                <p>정말로 "<strong>{{ post.title }}</strong>" 게시글을 삭제하시겠습니까?</p>
                <p class="text-muted">이 작업은 되돌릴 수 없습니다.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'board:detail' post.pk %}" class="btn btn-secondary">취소</a>
                        <button type="submit" class="btn btn-danger">삭제</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
